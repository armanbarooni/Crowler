<script th:src="@{/mylocal/persian-datepicker.min.js}"></script>
<script>
    var to, from;
    to = $(".range-to-example").persianDatepicker({
        altField: '.range-to-example-alt',

        altFormat: 'LLLL',
        autoClose: true,
        format: 'YYYY/MM/DD',
        calendarType: 'gregorian',
        initialValue: false,
        onSelect: function (unix) {
            to.touched = true;
            if (from && from.options && from.options.maxDate != unix) {
                var cachedValue = from.getState().selected.unixDate;
                from.options = {maxDate: unix};
                if (from.touched) {
                    from.setDate(cachedValue);
                }
            }
        }
    });
    from = $(".range-from-example").persianDatepicker({
        altField: '.range-from-example-alt',
        altFormat: 'LLLL',
        autoClose: true,
        format: 'YYYY/MM/DD',
        calendarType: 'gregorian',
        initialValue: false,
        onSelect: function (unix) {
            from.touched = true;
            if (to && to.options && to.options.minDate != unix) {
                var cachedValue = to.getState().selected.unixDate;
                to.options = {minDate: unix};
                if (to.touched) {
                    to.setDate(cachedValue);
                }
            }
        }
    });

</script>
<script>
    $('.on-select-example').persianDatepicker({
        altFormat: 'LLLL',
        autoClose: true,
        format: 'YYYY/MM/DD',
        calendarType: 'gregorian',
        initialValue: false
    });
</script>

<script>
    let fullData = [];
    let currentPage = 1;
    const rowsPerPage = 50;
    const maxVisiblePages = 5;

    function getData() {
        swal({
            title: "منتظر دریافت پاسخ از سرور ...",
            text: "لطفاً منتظر بمانید!",
            buttons: false,
            className: "swal-temp"
        });

        const csrfToken = $("meta[name='_csrf']").attr("content");
        const csrfHeader = $("meta[name='_csrf_header']").attr("content");

        $.ajax({
            url: '[[@{/ordinary/report/reports-list}]]',
            type: "POST",
            data: {
                "usev": $("#input-search-usev").val(),
                "startDate": $("#fromDate").val(),
                "endDate": $("#toDate").val(),
                "file": $("#textField").val(),
                "_csrf": csrfToken
            },
            beforeSend: function (xhr) {
                xhr.setRequestHeader(csrfHeader, csrfToken);
            },
            success: function (response) {
                if (isNaN(response)) {
                    fullData = response;
                    currentPage = 1;
                    renderTablePage(currentPage);
                    swal.close();
                } else {
                    swal.close();
                    let msg = "";

                    switch (response) {
                        case -1: msg = "خطا در دریافت اطلاعات"; break;
                        case 0: msg = "هیچ بسته‌ای وارد نشده است"; break;
                        case 10: msg = "فرمت تاریخ اشتباه است؛ لطفاً به فرمت مشخص شده وارد شود"; break;
                        case 70007: msg = "بسته‌ای یافت نشد"; break;
                        default:
                            msg = response < -1
                                ? `خطا در خط ${Math.abs(response + 1)} بخش نام بسته‌ها: استفاده از کاراکتر غیر مجاز`
                                : `خطا در خط ${response} بخش نام بسته‌ها`;
                    }

                    swal({
                        title: "خطا",
                        text: msg,
                        icon: "error",
                        button: "تأیید",
                        className: "swal-temp"
                    });

                    $('tbody').html("");
                    $('#pagination-container').html("");
                }
            },
            error: function () {
                swal({
                    title: "خطا",
                    text: "خطا در دریافت اطلاعات",
                    icon: "error",
                    button: "تأیید",
                    className: "swal-temp"
                });
            }
        });
    }

    function renderTablePage(page) {
        const start = (page - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pagedData = fullData.slice(start, end);
        let output = "";

        for (let i = 0; i < pagedData.length; i++) {
            const item = pagedData[i];
            output += `
                <tr dir='ltr'>
                    <td>${start + i + 1}</td>
                    <td>${item.cveName || ''}</td>
                    <td>${item.packageName || ''}</td>
                    <td>${item.product || ''}</td>
                    <td>${item.version || ''}</td>
                    <td>${item.minVersion || ''}</td>
                    <td>${item.maxVersion || ''}</td>
                    <td>${item.cvss || ''}</td>
                    <td>${item.createdDate || ''}</td>
                    <td>${item.lastModifiedDate || ''}</td>
                </tr>
            `;
        }

        $('tbody').html(output);
        renderPaginationControls();
    }

    function renderPaginationControls() {
        const pageCount = Math.ceil(fullData.length / rowsPerPage);
        let buttons = "";

        if (pageCount <= 1) {
            $('#pagination-container').html("");
            return;
        }

        // Previous
        if (currentPage > 1) {
            buttons += `<button class="btn btn-outline-secondary m-1" onclick="changePage(${currentPage - 1})">قبلی</button>`;
        }

        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(pageCount, startPage + maxVisiblePages - 1);

        if (endPage - startPage < maxVisiblePages - 1) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        if (startPage > 1) {
            buttons += `<button class="btn btn-outline-primary m-1" onclick="changePage(1)">1</button>`;
            if (startPage > 2) {
                buttons += `<span class="m-1">...</span>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            buttons += `<button class="btn m-1 ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}" onclick="changePage(${i})">${i}</button>`;
        }

        if (endPage < pageCount) {
            if (endPage < pageCount - 1) {
                buttons += `<span class="m-1">...</span>`;
            }
            buttons += `<button class="btn btn-outline-primary m-1" onclick="changePage(${pageCount})">${pageCount}</button>`;
        }

        // Next
        if (currentPage < pageCount) {
            buttons += `<button class="btn btn-outline-secondary m-1" onclick="changePage(${currentPage + 1})">بعدی</button>`;
        }

        $('#pagination-container').html(buttons);
    }

    function changePage(page) {
        currentPage = page;
        renderTablePage(page);
    }

    $('#mngmt-vulns').next().removeClass('collapse');
</script>
